name: Publier portfolio V7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v5

      - name: Extraire le portfolio
        run: |
          mkdir -p site
          unzip -q -o portfolio-v7.zip -d site
          test -f site/index.html
          test -f site/sql-lab.js

      - name: Publier GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
